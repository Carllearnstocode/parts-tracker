<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Parts</title>
    <link rel="stylesheet" href="addparts.css">
</head>
<body>
    <div class="main-header">
        <img src="images&shits/trackmyparts.png" alt="Logo" width="60">
    </div>
    <hr>
    <div class="page-header">
        <div>
            <p class="tagline"><em>Choose your vehicle brand</em></p>
            <h1>Shop Parts</h1>
        </div>
        <div class="header-actions">
            <a href="index.html" class="ghost-button">Back</a>
        </div>
    </div>

    <section class="carousel-shell">
        <div class="carousel-title">Tap the arrows to browse brands</div>
        <div class="carousel">
            <button class="carousel-control prev" id="prevBtn" aria-label="Previous brand">‹</button>
            <div class="carousel-track" id="carouselTrack"></div>
            <button class="carousel-control next" id="nextBtn" aria-label="Next brand">›</button>
        </div>
        <div class="slide-indicators" id="slideIndicators"></div>
    </section>

    <section class="brand-details" id="brandDetails">
        <h2 class="selected-label">Selected brand</h2>
        <p class="selected-name">Honda</p>
        <p class="selected-note">Review parts and accessories for your chosen bike brand.</p>
        <a href="#" class="select-brand-button" id="selectBrandBtn">Select Honda</a>
    </section>

    <script>
        const brands = [
            {name: 'Honda', accent: '#d32f2f', description: 'Reliable Japanese bikes with strong after-market support.', image: 'images&shits/honda.png'},
            {name: 'Suzuki', accent: '#1565c0', description: 'Sporty and durable bikes for street and off-road use.', image: 'images&shits/suzuki.png'},
            {name: 'Yamaha', accent: '#004d40', description: 'Performance machines with modern styling.', image: 'images&shits/yamaha.png'},
            {name: 'Kawasaki', accent: '#2e7d32', description: 'Aggressive power and iconic green styling.', image: 'images&shits/kawasaki.png'},
            {name: 'China Bike', accent: '#6a1b9a', description: 'Affordable parts for budget-friendly motorcycles.', image: 'images&shits/china-bike.png'}
        ];

        const track = document.getElementById('carouselTrack');
        const details = document.getElementById('brandDetails');
        const indicators = document.getElementById('slideIndicators');
        const selectBtn = document.getElementById('selectBrandBtn');

        let currentIndex = 0;

        function renderSlides() {
            track.innerHTML = brands.map(brand => `
                <article class="carousel-slide">
                    <div class="brand-card" style="border-color: ${brand.accent};">
                        <div class="brand-visual" style="border-color: ${brand.accent};">
                            <img src="${brand.image}" alt="${brand.name} logo" class="brand-image">
                        </div>
                        <div class="brand-copy">
                            <h3>${brand.name}</h3>
                            <p>${brand.description}</p>
                        </div>
                    </div>
                </article>
            `).join('');

            indicators.innerHTML = brands.map((_, index) => `
                <button class="indicator${index === currentIndex ? ' active' : ''}" data-index="${index}" aria-label="Select brand ${index + 1}"></button>
            `).join('');

            document.querySelectorAll('.indicator').forEach(button => {
                button.addEventListener('click', () => {
                    currentIndex = Number(button.dataset.index);
                    updateCarousel();
                });
            });
        }

        function updateCarousel() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            document.querySelectorAll('.indicator').forEach((button, idx) => {
                button.classList.toggle('active', idx === currentIndex);
            });
            const brand = brands[currentIndex];
            details.querySelector('.selected-name').textContent = brand.name;
            details.querySelector('.selected-note').textContent = brand.description;
            selectBtn.textContent = `Select ${brand.name}`;
            selectBtn.href = `#`;
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + brands.length) % brands.length;
            updateCarousel();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % brands.length;
            updateCarousel();
        });

        selectBtn.addEventListener('click', event => {
            event.preventDefault();
            alert(`You selected ${brands[currentIndex].name}. Ready to shop parts!`);
        });

        renderSlides();
        updateCarousel();
    </script>
</body>
</html>
